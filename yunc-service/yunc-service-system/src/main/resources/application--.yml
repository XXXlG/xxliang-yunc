server:
  port: 10020
spring:
  application:
    name: service-system #服务名
  cloud: #注册到Nacos
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:13306/ymcc-system?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
#    使用druid连接池
    type: com.alibaba.druid.pool.DruidDataSource
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml #指定mapper文件位置
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印sql
