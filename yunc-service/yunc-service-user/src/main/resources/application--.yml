server:
  port: 10030
spring:
  application:
    name: service-user #服务名
  cloud: #注册到Nacos
    alibaba:
      seata:
        tx-service-group: fsp_tx_group #这里和file.conf中事务组名一样
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:13306/ymcc-user?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
#    使用druid连接池
    type: com.alibaba.druid.pool.DruidDataSource
#    redis 配置
  redis:
    database: 0 #数据库索引
    host: 127.0.0.1 #地址
    port: 6379 #端口
    jedis: #jedis连接池配置
      pool: #连接池配置
        max-wait: 2000ms #最大等待时间
        min-idle: 2 #最小空闲连接数
        max-idle: 8 #最大空闲连接数
seata:
  enableAutoDataSourceProxy: false #关闭dataSource代理自动配置，我们要手动配置

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml #指定mapper文件位置
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印sql
