server:
  port: 10050
spring:
  application:
    name: service-course #服务名
  cloud: #注册到Nacos
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  datasource:
    username: root
    password: 123456
    url: jdbc:mysql://127.0.0.1:13306/ymcc-course?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
#    使用druid连接池
    type: com.alibaba.druid.pool.DruidDataSource
  redis:
    database: 0 #数据库索引
    host: 127.0.0.1 #地址
    port: 6379 #端口
    password: 123456
    jedis: #jedis连接池配置
      pool: #连接池配置
        max-wait: 2000ms #最大等待时间
        min-idle: 2 #最小空闲连接数
        max-idle: 8 #最大空闲连接数
mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml #指定mapper文件位置
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl #打印sql

rocketmq:
  name-server: 127.0.0.1:9876
  #生产者配置
  producer:
    #生产者组名字
    group: "service-producer"
    # 消息最大长度 默认 1024 * 4 (4M)
    max-message-size: 4096
    # 发送消息超时时间，默认 3000
    send-message-timeout: 3000
    # 发送消息失败重试次数，默认2
    retry-times-when-send-failed: 2
    retry-times-when-send-async-failed: 2