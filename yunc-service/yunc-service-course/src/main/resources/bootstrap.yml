spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    active: dev
  application:
    name: service-course
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848 #注册中心
        group: DEFAULT_GROUP
      config:
        server-addr: 127.0.0.1:8848 #配置中心
        namespace: ymcc-xxliang
        group: DEFAULT_GROUP
        file-extension: yaml #配置文件格式
        prefix: application-course #配置前缀 ，默认使用sring.application.name